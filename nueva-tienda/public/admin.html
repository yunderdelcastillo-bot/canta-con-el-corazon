<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#321b25"><title>Panel administrador | Canta con el Corazón</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2f1;color:#2d2025;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;color:#a82f57;letter-spacing:1px}.muted{color:#796d72}.card{background:white;border:1px solid #eadfe1;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 28px #3617230a}.login{max-width:430px;margin:12vh auto}.input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:8px 0 14px}.btn{border:0;border-radius:11px;padding:12px 16px;background:#bd3b65;color:white;font-weight:800;cursor:pointer}.btn.alt{background:#f5e8ec;color:#86314e}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff4f5;border-radius:14px;padding:17px}.stat b{display:block;font-size:28px;margin-top:6px}.orders{display:grid;gap:12px}.order{border:1px solid #eadfe1;border-radius:14px;padding:16px}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.tag{font-size:12px;font-weight:800;padding:6px 9px;border-radius:99px;background:#f7e9ed;color:#8d3452}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#b42345}.hidden{display:none}a{color:#a82f57}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px}}
</style></head><body><main class="wrap">
<section id="login" class="card login"><div class="brand">CANTA CON EL CORAZÓN</div><h1>Panel administrador</h1><p class="muted">Acceso privado de la nueva tienda.</p><form id="loginForm"><label for="password">Contraseña de administrador</label><input class="input" id="password" type="password" required autocomplete="current-password"><button class="btn" style="width:100%">Ingresar</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" class="hidden"><header class="top"><div><div class="brand">CANTA CON EL CORAZÓN</div><h1>Panel de pedidos</h1><p class="muted">Administración exclusiva de la nueva tienda · Canción completa S/30</p></div><button id="logout" class="btn alt">Cerrar sesión</button></header>
<div class="grid"><div class="stat">Pedidos registrados<b id="total">0</b></div><div class="stat">Pagos por revisar<b id="pending">0</b></div><div class="stat">Pagos aprobados<b id="paid">0</b></div></div>
<div class="card"><div class="row"><h2>Pedidos de clientes</h2><button id="refresh" class="btn alt">Actualizar</button></div><div id="orders" class="orders"><p class="muted">Cargando pedidos...</p></div><p id="dbNote" class="muted"></p></div></section>
</main><script>
const $=s=>document.querySelector(s),login=$("#login"),dash=$("#dashboard");
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ocurrió un error");return d}
async function enter(){login.classList.add("hidden");dash.classList.remove("hidden");await load()}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginError").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#password").value})});$("#password").value="";await enter()}catch(x){$("#loginError").textContent=x.message}});
async function check(){try{await api("/api/admin/me");await enter()}catch{}}
async function load(){const box=$("#orders");box.innerHTML="<p class='muted'>Cargando...</p>";try{const d=await api("/api/admin/orders");const arr=d.orders||[];$("#total").textContent=arr.length;$("#pending").textContent=arr.filter(o=>o.payment_status!=="aprobado").length;$("#paid").textContent=arr.filter(o=>o.payment_status==="aprobado").length;box.innerHTML="";if(!arr.length)box.innerHTML="<p class='muted'>Todavía no hay pedidos registrados.</p>";for(const o of arr){const el=document.createElement("article");el.className="order";const details=o.details||{};el.innerHTML=`<div class="row"><strong>Pedido #${o.id} · ${safe(o.customer_name)}</strong><span class="tag">${safe(o.status)} · Pago: ${safe(o.payment_status)}</span></div><p><b>Para:</b> ${safe(details.recipient||"—")} &nbsp; <b>Estilo:</b> ${safe(details.genre_custom||details.genre||"—")}</p><p><b>Ocasión:</b> ${safe(details.occasion||"—")} &nbsp; <b>Voz:</b> ${safe(details.voice||"—")}</p><p><b>Mensaje:</b> ${safe(details.message||"—")}</p><p class="muted">Registrado: ${new Date(o.created_at).toLocaleString("es-PE")}</p><div class="actions"><button class="btn" data-id="${o.id}" data-action="approve">Aprobar pago</button><button class="btn alt" data-id="${o.id}" data-action="reject">Rechazar pago</button></div>`;box.append(el)}$("#dbNote").textContent="Los comprobantes y archivos de audio aparecerán aquí cuando se conecten sus funciones de carga y almacenamiento."}catch(e){box.innerHTML="<p class='error'>"+safe(e.message)+"</p>"}}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#orders").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const approved=b.dataset.action==="approve";if(!confirm(approved?"¿Confirmas que recibiste y verificaste el pago Yape?":"¿Deseas marcar este pago como rechazado?"))return;try{await api("/api/admin/orders/"+b.dataset.id,{method:"PATCH",body:JSON.stringify({payment_status:approved?"aprobado":"rechazado",status:approved?"pago_aprobado":"pago_rechazado"})});await load()}catch(x){alert(x.message)}});
$("#refresh").onclick=load;$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});dash.classList.add("hidden");login.classList.remove("hidden")};check();
</script></body></html>
